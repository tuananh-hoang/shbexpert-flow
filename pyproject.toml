[project]
name = "dashmint-synthetic-data"
version = "0.1.0"
description = "Dataset-first synthetic banking data pipeline"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[project.scripts]
mockdata = "synthetic_data_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
