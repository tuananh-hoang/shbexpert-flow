# Model tiering (ai-architecture.md §7) — a slot, not a hard-coded provider.
# Swap provider/model here; agent code never imports a provider SDK directly,
# it only calls worker/app/llm/adapter.py::complete(tier=...).
tiers:
  fast:
    provider: openai   # FPT AI Factory (OpenAI-compatible), not OpenAI cloud — see OPENAI_BASE_URL in .env
    model: gpt-oss-120b
    max_tokens: 4096
  reasoning:
    provider: openai
    model: gpt-oss-120b
    max_tokens: 8192

budget:
  max_tokens_per_run: 400000
  max_cost_per_run_usd: 2.00
